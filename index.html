<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Valentine Popup</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" id="app" aria-live="polite">
      <section class="screen screen--intro" id="screen-intro" aria-hidden="false">
        <div class="window" role="dialog" aria-label="Pixel popup">
          <div class="titlebar">
            <span class="title">valentine.exe</span>
            <button class="close" type="button" aria-label="Close"></button>
          </div>
          <div class="content">
            <div class="heart" aria-hidden="true"></div>
            <p class="message">hiii amuu :)</p>
            <div class="button-hitbox" id="button-hitbox">
              <button class="pixel-button" type="button">press me</button>
            </div>
          </div>
        </div>
      </section>

      <section class="screen screen--next" id="screen-next" aria-hidden="true">
        <div class="next-placeholder">next screen</div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
